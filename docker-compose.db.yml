version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: style-my-closet
    environment:
      - POSTGRES_DB=${DB_NAME:-stylemycloset}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_INITDB_ARGS=--auth-host=md5 --auth-local=trust
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - my-network

  redis:
    image: redis:7.2
    command: [ "redis-server" ]
    container_name: closet_redis
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  redis-data:

networks:
  my-network:
    driver: bridge