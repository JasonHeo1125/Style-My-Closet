spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 60000
  flyway:
    enabled: true
  batch:
    jdbc:
      initialize-schema: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: false

server:
  port: 8080

management:
  health:
    mail:
      enabled: false

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    access-token-validity-seconds: ${SECURITY_JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
    refresh-token-validity-seconds: ${SECURITY_JWT_REFRESH_TOKEN_VALIDITY_SECONDS:86400}

logging:
  level:
    com.stylemycloset: DEBUG
    org.hibernate.SQL: DEBUG

recommendation:
  engine: ${RECOMMENDATION_ENGINE:local}

external-ml:
  huggingface:
    base-url: ${HUGGINGFACE_BASE_URL:https://api-inference.huggingface.co}
    token: ${HUGGINGFACE_TOKEN:}
